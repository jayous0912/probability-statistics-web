<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1강 퀴즈 | 확률과 통계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  .wrap { max-width: 760px; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 12px; font-weight: 700; color: var(--navy); }
  .prog { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin-bottom: 24px; }
  .prog i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .3s; }
  .q { font-size: clamp(20px, 3vw, 26px); font-weight: 700; line-height: 1.5; margin-bottom: 20px; color: var(--navy); }
  .q small { display: block; font-size: 15px; color: var(--gray); font-weight: 500; margin-bottom: 6px; }
  .opts { display: grid; gap: 12px; list-style: none; }
  .opt {
    width: 100%; text-align: left; font-size: 18px; padding: 14px 18px; border-radius: 14px;
    background: #fff; border: 2px solid var(--line); color: var(--ink); display: flex; gap: 14px; align-items: center;
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--sky); }
  .opt .k { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--pale); color: var(--navy); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .opt.ok { border-color: var(--ok); background: #E8F6F0; }
  .opt.ok .k { background: var(--ok); color: #fff; }
  .opt.bad { border-color: var(--bad); background: #FCEDED; }
  .opt.bad .k { background: var(--bad); color: #fff; }
  .opt:disabled { cursor: default; }
  .exp { margin-top: 18px; padding: 16px 18px; border-radius: 14px; background: var(--pale); border-left: 8px solid var(--blue); }
  .exp b { color: var(--navy); }
  .actions { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
  .score { font-size: clamp(48px, 10vw, 84px); font-weight: 900; color: var(--blue); line-height: 1; }
  .review { margin-top: 20px; display: grid; gap: 10px; list-style: none; }
  .review li { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 12px 16px; display: flex; gap: 12px; }
  .review .m { flex: none; font-weight: 900; }
  .review .y { color: var(--ok); } .review .n { color: var(--bad); }
  .hide { display: none !important; }
  .kbd { font-size: 13px; color: var(--gray); margin-top: 14px; }
</style>
</head>
<body>
<header class="topbar">
  <a href="../">확률과 통계</a><span class="sp"></span>
  <nav><a href="../slides/">슬라이드</a><a href="./" aria-current="page">퀴즈</a><a href="../playground/">플레이그라운드</a></nav>
</header>

<main class="wrap">
  <h1>1강 퀴즈</h1>
  <p class="muted" style="margin-top:6px">확률변수와 확률분포 · 8문항</p>

  <section id="play" class="card" style="margin-top:20px" aria-live="polite">
    <div class="meta"><span id="no">1 / 8</span><span id="sc">0점</span></div>
    <div class="prog" aria-hidden="true"><i id="pb"></i></div>
    <div class="q" id="q"></div>
    <ul class="opts" id="opts"></ul>
    <div class="exp hide" id="exp"></div>
    <div class="actions"><button class="btn hide" id="nextBtn">다음 문제</button></div>
    <p class="kbd">키보드 : 1~4 선택 · Enter 다음 문제</p>
  </section>

  <section id="done" class="card hide" style="margin-top:20px">
    <p class="muted">결과</p>
    <p class="score" id="final"></p>
    <p id="msg" style="margin-top:10px;font-size:18px"></p>
    <ul class="review" id="review"></ul>
    <div class="actions">
      <button class="btn" id="again">처음부터 다시</button>
      <button class="btn ghost" id="wrongOnly">틀린 문제만 다시</button>
      <a class="btn ghost" href="../slides/" style="text-decoration:none">슬라이드 복습</a>
    </div>
  </section>
</main>

<script>
(function () {
  var BANK = [
    { t: '동전 2개를 던질 때 앞면의 수 X가 가질 수 있는 값은?', c: ['0, 1', '0, 1, 2', '1, 2', '0, 1, 2, 3'], a: 1,
      e: '둘 다 뒷면이면 0, 하나만 앞면이면 1, 둘 다 앞면이면 2입니다. 따라서 X ∈ {0, 1, 2}.' },
    { t: '동전 2개를 던질 때 P(X=1)은? (X = 앞면의 수)', c: ['1/4', '1/3', '1/2', '3/4'], a: 2,
      e: '앞뒤, 뒤앞의 2가지이므로 2/4 = 1/2입니다.' },
    { t: '이산확률변수의 확률분포에서 모든 확률의 합은?', c: ['0', '1/2', '1', '값에 따라 다름'], a: 2,
      e: '모든 값에 대한 확률을 더하면 항상 1입니다. (p₁ + p₂ + … + pₙ = 1)' },
    { t: '다음 중 이산확률변수로 보기 가장 알맞은 것은?', c: ['한 부품의 길이(mm)', '센서 측정 오차(V)', '주사위 한 개를 던져 나온 눈의 수', '학생의 키(cm)'], a: 2,
      e: '주사위 눈은 1~6처럼 셀 수 있는 값만 가집니다. 길이, 오차, 키는 구간 안의 모든 값이 가능한 연속확률변수입니다.' },
    { t: '연속확률변수 X에서 P(a ≤ X ≤ b)는 무엇과 같은가?', c: ['밀도곡선의 a에서의 높이', '밀도곡선 아래 a부터 b까지의 넓이', 'b − a', '밀도곡선의 최댓값'], a: 1,
      e: '연속확률변수의 확률은 확률밀도함수 곡선 아래, 구간 [a, b] 위의 넓이입니다.' },
    { t: '연속확률변수 X에서 한 점의 확률 P(X = a)는?', c: ['0', '1', '밀도곡선의 높이', '1/2'], a: 0,
      e: '한 점은 넓이가 0이므로 확률도 0입니다. 그래서 연속확률변수는 구간으로 확률을 구합니다.' },
    { t: '주사위 한 개를 던져 나온 눈의 수를 X라 할 때 P(X ≥ 5)는?', c: ['1/6', '1/3', '1/2', '2/3'], a: 1,
      e: 'X = 5 또는 6이므로 1/6 + 1/6 = 2/6 = 1/3입니다.' },
    { t: 'P(X=0)=1/5, P(X=1)=2/5, P(X=2)=k인 확률분포에서 k는?', c: ['1/5', '2/5', '3/5', '4/5'], a: 1,
      e: '확률의 합이 1이므로 1/5 + 2/5 + k = 1, 따라서 k = 2/5입니다.' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var state, order, cur, score, answered, wrong;

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function start(indices) {
    order = indices; cur = 0; score = 0; wrong = [];
    $('done').classList.add('hide'); $('play').classList.remove('hide');
    render();
  }

  function render() {
    var q = BANK[order[cur]];
    answered = false;
    $('no').textContent = (cur + 1) + ' / ' + order.length;
    $('sc').textContent = score + '점';
    $('pb').style.width = (cur / order.length * 100) + '%';
    $('q').innerHTML = '<small>문제 ' + (cur + 1) + '</small>';
    $('q').appendChild(document.createTextNode(q.t));
    var ul = $('opts'); ul.innerHTML = '';
    // 보기 순서 섞기 (정답 위치 추적)
    var perm = shuffle([0, 1, 2, 3]);
    perm.forEach(function (orig, pos) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.className = 'opt'; b.type = 'button'; b.dataset.orig = orig;
      var k = document.createElement('span'); k.className = 'k'; k.textContent = pos + 1;
      var tx = document.createElement('span'); tx.textContent = q.c[orig];
      b.appendChild(k); b.appendChild(tx);
      b.onclick = function () { pick(b, orig === q.a); };
      li.appendChild(b); ul.appendChild(li);
    });
    $('exp').classList.add('hide');
    $('nextBtn').classList.add('hide');
    $('nextBtn').textContent = cur === order.length - 1 ? '결과 보기' : '다음 문제';
  }

  function pick(btn, correct) {
    if (answered) return;
    answered = true;
    var q = BANK[order[cur]];
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) {
      b.disabled = true;
      if (+b.dataset.orig === q.a) b.classList.add('ok');
    });
    if (correct) { score++; } else { btn.classList.add('bad'); wrong.push(order[cur]); }
    $('sc').textContent = score + '점';
    var ex = $('exp');
    ex.innerHTML = '';
    var h = document.createElement('b'); h.textContent = correct ? '정답입니다. ' : '아쉽습니다. ';
    ex.appendChild(h); ex.appendChild(document.createTextNode(q.e));
    ex.classList.remove('hide');
    $('nextBtn').classList.remove('hide');
    $('nextBtn').focus();
  }

  function finish() {
    $('play').classList.add('hide'); $('done').classList.remove('hide');
    $('final').textContent = score + ' / ' + order.length;
    var r = score / order.length;
    $('msg').textContent = r === 1 ? '만점입니다. 2강으로 넘어가도 좋습니다.' :
      r >= 0.7 ? '좋은 결과입니다. 틀린 문제의 해설을 한 번 더 확인해 보세요.' :
      '슬라이드를 한 번 더 보고 다시 도전해 보세요.';
    var ul = $('review'); ul.innerHTML = '';
    order.forEach(function (i) {
      var ok = wrong.indexOf(i) < 0;
      var li = document.createElement('li');
      var m = document.createElement('span'); m.className = 'm ' + (ok ? 'y' : 'n'); m.textContent = ok ? '○' : '✕';
      var d = document.createElement('span'); d.textContent = BANK[i].t;
      li.appendChild(m); li.appendChild(d); ul.appendChild(li);
    });
    $('wrongOnly').classList.toggle('hide', wrong.length === 0);
  }

  $('nextBtn').onclick = function () { cur++; if (cur >= order.length) finish(); else render(); };
  $('again').onclick = function () { start(shuffle(BANK.map(function (_, i) { return i; }))); };
  $('wrongOnly').onclick = function () { start(shuffle(wrong)); };

  document.addEventListener('keydown', function (e) {
    if ($('play').classList.contains('hide')) return;
    if (/^[1-4]$/.test(e.key) && !answered) {
      var b = document.querySelectorAll('.opt')[+e.key - 1];
      if (b) b.click();
    } else if (e.key === 'Enter' && answered && document.activeElement !== $('nextBtn')) {
      $('nextBtn').click();
    }
  });

  start(shuffle(BANK.map(function (_, i) { return i; })));
})();
</script>
</body>
</html>
